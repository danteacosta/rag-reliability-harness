name: eval-gate
on:
  push:
  pull_request:
jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_TEST_DSN: postgresql://rag:rag@localhost:5432/rag_harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,pgvector]"
      - run: pytest -q
      - run: python -m ingest --mutable-version v2
      - run: python -m eval
      - run: python -m gates
      - run: python -m loop

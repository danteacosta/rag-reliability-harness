[project]
name = "rag-reliability-harness"
version = "0.1.0"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "agent-reliability-protocol @ git+https://github.com/danteacosta/agent-reliability-protocol.git@95c93db4fd77f0363f5e6dc48f43798afc8eb4be",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "langchain-core>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pgvector = ["psycopg[binary]>=3.1"]

[project.scripts]
rag-reliability = "rag_harness.cli:main"
rag-product = "product.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_harness*", "ingest*", "retrieval*", "eval*", "gates*", "observability*", "loop*", "product*", "product_memory*"]
